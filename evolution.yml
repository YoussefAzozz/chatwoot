version: "3.7"

services:
  evolution_v2:
    image: chat2one/sending2:v2.6.9.1
    networks:
      - nome_rede_interna

    command: >
      sh -c '
        echo "Waiting for PostgreSQL...";
        until nc -z postgres 5432; do
          sleep 2;
        done;
        echo "PostgreSQL is up!";
        node dist/main
      '

    environment:
      - SERVER_NAME=evolution
      - SERVER_URL=https://evo.grwx.me

      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:password@postgres:5432/evolution_db

      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution_v2

      - AUTHENTICATION_API_KEY=uxzHsv2O2kGXiR2l2+/gyUdnY6PRsSVF9JsUk3Fatvg=
      - LANGUAGE=es

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true

        # Router
        - traefik.http.routers.evolution_v2.rule=Host(``)
        - traefik.http.routers.evolution_v2.entrypoints=websecure
        - traefik.http.routers.evolution_v2.tls.certresolver=letsencryptresolver
        - traefik.http.routers.evolution_v2.priority=1
        - traefik.http.routers.evolution_v2.service=evolution_v2
        - traefik.http.routers.evolution_v2.middlewares=sslheader

        # Service
        - traefik.http.services.evolution_v2.loadbalancer.server.port=8080
        - traefik.http.services.evolution_v2.loadbalancer.passHostHeader=true

        # Middleware (ONLY ONCE!)
        - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: evolution_db
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      labels:
        - traefik.enable=false
    networks:
      - nome_rede_interna

volumes:
  postgres-data:
    external: true
    name: postgres-data

networks:
  nome_rede_interna:
    external: true
    name: nome_rede_interna
