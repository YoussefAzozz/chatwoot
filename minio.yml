version: "3.7"
services:

  minio:
    image: quay.io/minio/minio:latest ## Versão do Minio
    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

    networks:
      - nome_rede_interna ## Nome da rede interna

    environment:
      ## Dados de acesso
      - MINIO_ROOT_USER=user_minio
      - MINIO_ROOT_PASSWORD=senha_minio ## Precisa conter no minimo 8 caracteres

      ## Url do minio
      - MINIO_BROWSER_REDIRECT_URL=https://s3.grwx.me ## Url do minio
      - MINIO_SERVER_URL=http://minio:9000 ## Url do s3 | Comente esta linha caso tiver erro ao fazer login

      ## Região
      - MINIO_REGION_NAME=eu-south

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.minio-console.rule=Host(`s3.grwx.me`)
        - traefik.http.routers.minio-console.entrypoints=websecure
        - traefik.http.routers.minio-console.tls.certresolver=letsencryptresolver
        - traefik.http.services.minio-console.loadbalancer.server.port=9001
        - traefik.http.services.minio-console.loadbalancer.passHostHeader=true
        - traefik.http.routers.minio-console.service=minio-console
        - traefik.http.middlewares.minio-console-ipwhitelist.ipwhitelist.sourcerange=154.176.40.253/32
        - traefik.http.routers.minio-console.middlewares=minio-console-ipwhitelist


## --------------------------- ORION --------------------------- ##

volumes:
  minio_data:
    external: true
    name: minio_data

networks:
  nome_rede_interna: ## Nome da rede interna
    external: true
    name: nome_rede_interna ## Nome da rede interna